<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louisiana Air</title>
</head>

<body>

    <h1>Louisiana Air</h1>

    <p>Welcome aboard Louisiana Air!</p>

    <h2>Book a Flight</h2>

    <form>
        <label for="from">From:</label>
        <input type="text" id="from" placeholder="MSY">

        <br><br>

        <label for="to">To:</label>
        <input type="text" id="to" placeholder="JFK">

        <br><br>

        <label for="date">Departure:</label>
        <input type="date" id="date">

        <br><br>

        <button type="submit">Search Flights</button>
    </form>

</body>
</html>
